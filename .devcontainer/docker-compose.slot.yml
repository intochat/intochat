# Reusable IntoChat OS dev-slot stack (INT-2595).
# Used locally by `agent-dev-slots` (parameterized per leased slot via env vars)
# and as the portable container topology baseline for Wave 2 Cloud ACA Consumption Jobs.
#
# Default port stride matches CandidateSlotPoolOptions (BasePort=5300, Stride=10):
#   +0 HTTP  (5300), +1 MCP (5301), +2 Azurite Blob (5302), +3 Azurite Table (5303),
#   +4 Postgres (5304), +5 ClickHouse (5305).
# Never collides with live Aspire ports 5080/5081 or legacy 5190.

name: intochat-devslot-${SLOT_ID:-slot-00}

services:
  candidate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_NAME: agent
        USER_UID: ${SLOT_USER_UID:-1000}
        USER_GID: ${SLOT_USER_GID:-1000}
    image: ${SLOT_CANDIDATE_IMAGE:-intochat-os-devslot:local}
    container_name: devslot-${SLOT_ID:-slot-00}-candidate
    hostname: devslot-${SLOT_ID:-slot-00}-candidate
    user: "${SLOT_USER_UID:-1000}:${SLOT_USER_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${SLOT_MEMORY_LIMIT:-2g}
    cpus: ${SLOT_CPU_LIMIT:-2}
    working_dir: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SLOT_HTTP_PORT:-5300}:5080"
    volumes:
      - "${SLOT_WORKSPACE_DIR:-..}:/workspace:cached"
      - slot-home:/home/agent
    environment:
      ASPNETCORE_URLS: "http://+:5080"
      HOME: "/home/agent"
      XDG_CONFIG_HOME: "/home/agent/.config"
      XDG_DATA_HOME: "/home/agent/.local/share"
      XDG_CACHE_HOME: "/home/agent/.cache"
      TMPDIR: "/home/agent/tmp"
      DOTNET_CLI_HOME: "/home/agent"
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: "/dev/null"
      PLAYWRIGHT_BROWSERS_PATH: "/opt/playwright"
      IntoChatOS__Home: "/home/agent/intochat-home"
      IntoChatOS__Auth__Posture: "Open"
      IntoChatOS__Auth__AllowOpenOnNetwork: "true"
      IntoChatOS__Platform__Parts__ConfiguredCustodyAcknowledged: "true"
      SLOT_ID: "${SLOT_ID:-slot-00}"
      OTEL_SERVICE_NAME: "devslot-${SLOT_ID:-slot-00}-candidate"
    depends_on:
      azurite:
        condition: service_started
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - slot-net
    labels:
      intochat.devslot: "true"
      intochat.devslot.role: "candidate"
      intochat.devslot.slot: "${SLOT_ID:-slot-00}"
    command: ["sleep", "infinity"]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: devslot-${SLOT_ID:-slot-00}-azurite
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --skipApiVersionCheck
      - --loose
    ports:
      - "127.0.0.1:${SLOT_AZURITE_BLOB_PORT:-5302}:10000"
      - "127.0.0.1:${SLOT_AZURITE_TABLE_PORT:-5303}:10002"
    networks:
      - slot-net
    labels:
      intochat.devslot: "true"
      intochat.devslot.role: "sidecar"
      intochat.devslot.slot: "${SLOT_ID:-slot-00}"

  postgres:
    image: postgres:18.3
    container_name: devslot-${SLOT_ID:-slot-00}-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${SLOT_POSTGRES_PASSWORD:-slot-ephemeral-postgres}"
    ports:
      - "127.0.0.1:${SLOT_POSTGRES_PORT:-5304}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - slot-net
    labels:
      intochat.devslot: "true"
      intochat.devslot.role: "sidecar"
      intochat.devslot.slot: "${SLOT_ID:-slot-00}"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: devslot-${SLOT_ID:-slot-00}-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "${SLOT_CLICKHOUSE_PASSWORD:-slot-ephemeral-clickhouse}"
    ports:
      - "127.0.0.1:${SLOT_CLICKHOUSE_PORT:-5305}:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - slot-net
    labels:
      intochat.devslot: "true"
      intochat.devslot.role: "sidecar"
      intochat.devslot.slot: "${SLOT_ID:-slot-00}"

networks:
  slot-net:
    name: devslot-${SLOT_ID:-slot-00}
    driver: bridge

volumes:
  slot-home:
    name: devslot-${SLOT_ID:-slot-00}-home
