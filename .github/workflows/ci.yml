name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks

      - name: Scan history with gitleaks
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --redact --verbose --config .gitleaks.toml --baseline-path .gitleaks-baseline.json'

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.DIGITALBRAIN_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx -v quiet

      - name: Format check
        run: dotnet format whitespace Intochat.OS.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build solution
        run: dotnet build Intochat.OS.slnx -c Release --no-restore -p:CodeGraphRefresh=false

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-artifacts
          path: artifacts/bin
          retention-days: 1

  test-unit:
    name: test-unit
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: compiled-artifacts
          path: artifacts/bin

      - name: Test (Unit Tier)
        run: dotnet test --solution Intochat.OS.slnx -c Release --no-build -p:IntoChatOSNightly=false -p:IntoChatOSOnlyTier=Unit -p:CodeGraphRefresh=false

  test-integration:
    name: test-integration
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: intochat-test-password
          POSTGRES_USER: postgres
          POSTGRES_DB: intochat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: compiled-artifacts
          path: artifacts/bin

      - name: Test (Integration Tier)
        run: dotnet test --solution Intochat.OS.slnx -c Release --no-build -p:IntoChatOSNightly=false -p:IntoChatOSOnlyTier=Integration -p:CodeGraphRefresh=false

  e2e:
    name: e2e
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: compiled-artifacts
          path: artifacts/bin

      - name: Test E2E
        run: |
          dotnet test --project src/IntoChat.OS.Kernel/IntoChat.OS.Kernel.Tests.E2E/IntoChat.OS.Kernel.Tests.E2E.csproj -c Release --no-build -p:CodeGraphRefresh=false
          dotnet test --project src/IntoChat.OS.Kernel/IntoChat.OS.Kernel.Tests.E2E.Aspire/IntoChat.OS.Kernel.Tests.E2E.Aspire.csproj -c Release --no-build -p:CodeGraphRefresh=false

  flutter:
    name: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Dart format check
        working-directory: ui
        run: dart format --output=none --set-exit-if-changed core ui shell

      - name: Analyze Flutter packages
        working-directory: ui
        run: |
          (cd core && dart analyze --fatal-infos)
          (cd ui && flutter analyze --no-pub)
          (cd shell && flutter analyze --no-pub)

      - name: Flutter tests
        working-directory: ui
        run: |
          (cd core && flutter test --no-pub --concurrency=4)
          (cd ui && flutter test --no-pub --exclude-tags golden --concurrency=4)
          (cd shell && flutter test --no-pub --concurrency=4)

  ci:
    name: ci
    needs: [build, test-unit, test-integration, e2e, flutter]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "build=${{ needs.build.result }} test-unit=${{ needs.test-unit.result }} test-integration=${{ needs.test-integration.result }} e2e=${{ needs.e2e.result }} flutter=${{ needs.flutter.result }}"
          exit 1
