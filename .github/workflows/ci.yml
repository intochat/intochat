name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']
  # A dropped push event leaves a master commit without ci, which release.yml requires; rerun it by hand.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

# Build once and run Unit + Integration tiers in-place (--no-build), eliminating multi-hundred-MB
# artifact transfers on private-repo storage while running format, blob-storage, and flutter in parallel.
jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Populate NuGet packages from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          mkdir -p ../nuget
          gh release download "${version}" --repo intochat/digitalbrain -p "*.nupkg" -D ../nuget --clobber
          gh release download "${version}" --repo intochat/os -p "*.nupkg" -D ../nuget --clobber
          gh release download "${version}" --repo intochat/modules -p "*.nupkg" -D ../nuget --clobber

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx -v quiet

      - name: Format code
        run: dotnet format whitespace Intochat.OS.slnx --verify-no-changes --no-restore --verbosity minimal

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The root disk has ~13 GB free and packages plus the solution's output need more (/mnt is the
      # same disk on this image). Cleanup runs in the background during the build instead of 1:38 up front.
      - name: Free the root disk in the background
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - name: Populate NuGet packages from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          mkdir -p ../nuget
          gh release download "${version}" --repo intochat/digitalbrain -p "*.nupkg" -D ../nuget --clobber
          gh release download "${version}" --repo intochat/os -p "*.nupkg" -D ../nuget --clobber
          gh release download "${version}" --repo intochat/modules -p "*.nupkg" -D ../nuget --clobber

      # Restore runs inside the build: one evaluation of the solution instead of two.
      - name: Build solution
        run: dotnet build Intochat.OS.slnx -c Release -v quiet -p:CodeGraphRefresh=false -p:IntoChatOSNightly=false

      - name: Deploy scripts and workflow facts
        run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py'

      - name: Module READMEs are current
        run: dotnet run scripts/module-readmes.cs -- --check

      # Local-profile preflight dry run: fixtures stand in for the machine, so no secrets and no probes of the runner.
      - name: Preflight dry run (all green exits 0)
        run: dotnet run intochat.cs preflight --fake src/IntoChat.OS.LocalSetup/IntoChat.OS.LocalSetup.Tests.Unit/fixtures/all-green.json

      - name: Preflight dry run (Windows containers exits 1 and names the fix)
        run: |
          set +e
          output=$(dotnet run intochat.cs preflight --fake src/IntoChat.OS.LocalSetup/IntoChat.OS.LocalSetup.Tests.Unit/fixtures/docker-windows-containers.json)
          code=$?
          echo "$output"
          [ "$code" -eq 1 ] || { echo "expected exit 1, got $code"; exit 1; }
          echo "$output" | grep -q "fix:" || { echo "expected a fix line"; exit 1; }

      - name: Preflight real probe (informational)
        continue-on-error: true
        run: dotnet run intochat.cs preflight --no-fail

      - name: Test (Unit)
        run: dotnet test Intochat.OS.slnx -c Release --no-build -p:IntoChatOSNightly=false -p:IntoChatOSOnlyTier=Unit -p:CodeGraphRefresh=false --filter "Tier=Unit" --report-xunit-trx --results-directory "$PWD/artifacts/trx"

      - name: Test (Integration)
        run: dotnet test Intochat.OS.slnx -c Release --no-build -p:IntoChatOSNightly=false -p:IntoChatOSOnlyTier=Integration -p:CodeGraphRefresh=false --filter "Tier=Integration" --report-xunit-trx --results-directory "$PWD/artifacts/trx"

      - name: Report TRX failures as annotations
        if: failure()
        run: |
          python3 -c '
          import glob, xml.etree.ElementTree as ET
          for p in glob.glob("artifacts/trx/**/*.trx", recursive=True):
              root = ET.parse(p).getroot()
              for r in root.findall(".//{*}UnitTestResult[@outcome=\"Failed\"]"):
                  name = r.attrib.get("testName", "unknown")
                  msg_el = r.find(".//{*}Message")
                  msg = (msg_el.text or "").replace("\n", " ").replace("\r", " ")[:400] if msg_el is not None else ""
                  print(f"::error title={name}::{msg}")
          '

      - name: Validate NuGet packages
        run: |
          dotnet pack Intochat.OS.slnx -c Release --no-build -v quiet -o artifacts/packages

  # Blob storage@1 against Azurite. The default Integration tier skips when port 10000 is closed.
  blob-storage:
    name: blob-storage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Start Azurite
        run: docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite azurite-blob -l /data --blobHost 0.0.0.0 --skipApiVersionCheck
      - name: Populate NuGet packages from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          mkdir -p ../nuget
          gh release download "${version}" --repo intochat/digitalbrain -p "*.nupkg" -D ../nuget --clobber
          gh release download "${version}" --repo intochat/os -p "*.nupkg" -D ../nuget --clobber
          gh release download "${version}" --repo intochat/modules -p "*.nupkg" -D ../nuget --clobber
      - name: Blob storage conformance
        run: dotnet test --project src/IntoChat.Cloud/Modules/Blob/tests/IntoChat.Cloud.Blob.Tests.Integration/IntoChat.Cloud.Blob.Tests.Integration.csproj -c Release -p:CodeGraphRefresh=false --report-xunit-trx --results-directory artifacts/blob-storage-results

  # Informational only: timings never gate a PR. Step-level continue-on-error keeps the job green when the API
  # call or the summary fails; jobs?filter=latest reads the newest attempt of every job, so a rerun of one failed
  # tier job reports the whole run instead of only the rerun jobs (attempts/N/jobs lists only that attempt's jobs).
  report:
    name: report
    needs: [format, build, blob-storage]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Job timings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "$API" > run.json
          gh api "$API/jobs?filter=latest" --paginate --jq '.jobs[]' | jq -s . > jobs.json
          jq -r --slurpfile run run.json '
            ($run[0].created_at | fromdate) as $t0
            | ["| job | start | end | duration | conclusion |", "|---|---|---|---|---|"][],
              (.[] | select(.completed_at != null)
                | ((.started_at|fromdate) - $t0) as $s | ((.completed_at|fromdate) - $t0) as $e
                | "| \(.name) | +\($s)s | +\($e)s | \(($e - $s) / 60 | floor):\(($e - $s) % 60 | tostring | if length < 2 then "0" + . else . end) | \(.conclusion) |"),
              "",
              ([.[] | select(.completed_at != null) | (.completed_at|fromdate) - $t0] | max
                | "Critical path (run created to last finished job): \(. / 60 | floor):\(. % 60 | tostring | if length < 2 then "0" + . else . end)")
          ' jobs.json >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: ci
    needs: [format, build, blob-storage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "format=${{ needs.format.result }} build=${{ needs.build.result }} blob-storage=${{ needs.blob-storage.result }}"
          exit 1

  # Prerelease packages to GitHub Packages, only after the aggregate ci job succeeded on a master push.
  publish:
    name: publish
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Populate NuGet packages from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          mkdir -p ../nuget
          gh release download "${version}" --repo intochat/digitalbrain -p "*.nupkg" -D ../nuget --clobber
          gh release download "${version}" --repo intochat/os -p "*.nupkg" -D ../nuget --clobber
          gh release download "${version}" --repo intochat/modules -p "*.nupkg" -D ../nuget --clobber

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx

      # Intochat.OS.slnx holds framework/ (06-00), so DigitalBrain.* pack here with the same pre.<run> suffix and the
      # IntoChat.OS.* dependency on DigitalBrain resolves from the same feed.
      - name: Pack prerelease packages
        run: dotnet pack Intochat.OS.slnx -c Release --no-restore -o artifacts -p:CodeGraphRefresh=false -p:VersionSuffix=pre.${{ github.run_number }}

      # Separate from pack so --skip-duplicate cannot mask a pack failure.
      - name: Push packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://nuget.pkg.github.com/intochat/index.json --api-key "${GITHUB_TOKEN}" --skip-duplicate
