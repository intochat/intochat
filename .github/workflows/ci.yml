name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  dotnet-unit:
    name: .NET build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Restore-only on pull requests: re-saving an identical multi-gigabyte cache costs about
      # a minute per run. Master pushes save, so every PR restores a fresh cache.
      - name: Restore NuGet package cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore DigitalBrain.slnx -v quiet

      - name: Format code
        run: dotnet format whitespace DigitalBrain.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build solution
        run: dotnet build DigitalBrain.slnx -c Release --no-restore -v quiet -p:CodeGraphRefresh=false

      - name: Build the sample C# file app
        run: dotnet build src/DigitalBrain.Modules/Microsoft/CSharp/Samples/timer-report.cs -c Release -v quiet -p:CodeGraphRefresh=false

      - name: Validate NuGet packages
        run: dotnet pack DigitalBrain.slnx -c Release --no-build -v quiet -o artifacts

      # Every suite except the AppHost-booting E2E projects, which run as their own matrix
      # legs below. These suites start no containers, so they need none of the Docker warming.
      - name: Test
        run: |
          set -euo pipefail
          failures=0
          for project in $(find src -name '*.Tests*.csproj' -not -name '*.Tests.E2E.csproj' | sort); do
            dotnet test "$project" -c Release --no-build -v quiet || failures=1
          done
          exit $failures

      - name: Save NuGet package cache
        if: github.ref == 'refs/heads/master' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

  dotnet-e2e:
    name: 'E2E: ${{ matrix.suite }}'
    runs-on: ubuntu-latest
    # The os suite runs the reference-brain facts and the product-host facts in one serial assembly.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: framework
            project: src/DigitalBrain/Framework/tests/DigitalBrain.Framework.Tests.E2E
            browser: true
          - suite: os
            project: src/DigitalBrain/OS/tests/DigitalBrain.OS.Tests.E2E
            browser: true
          - suite: aspire-hosting
            project: src/Aspire/tests/DigitalBrain.Aspire.Hosting.Tests.E2E
            browser: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore NuGet package cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }} -v quiet

      - name: Build suite
        run: dotnet build ${{ matrix.project }} -c Release --no-restore -v quiet -p:CodeGraphRefresh=false

      - name: Install Playwright browser and system dependencies
        if: matrix.browser == true
        run: pwsh ${{ matrix.project }}/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      # The AppHost builds the shell and sandbox images itself (content-tagged); these warmers
      # run the SAME Dockerfiles over the SAME contexts in the engine's own builder, so the
      # in-test builds hit a warm layer cache. A stale or failed warmer only means a slower
      # test, never a wrong artifact.
      - name: Warm the shell image layer cache
        if: matrix.browser == true
        run: docker build -f src/DigitalBrain.Modules/Google/Flutter/app/shell/Dockerfile src/DigitalBrain.Modules/Google/Flutter/app

      - name: Warm the sandbox image layer cache
        run: docker build src/DigitalBrain.Modules/Microsoft/CSharp/DigitalBrain.Modules.Microsoft.CSharp.Sandbox

      # Scripts restore inside the sandbox against its named NuGet volume; seeding it from the
      # host's packages (already restored for the suite) removes every in-sandbox download.
      - name: Seed the sandbox NuGet volume
        run: docker run --rm -v digitalbrain-csharp-nuget:/root/.nuget/packages -v $HOME/.nuget/packages:/seed:ro alpine sh -c "cp -a /seed/. /root/.nuget/packages/"

      - name: Test
        run: dotnet test ${{ matrix.project }} -c Release --no-build -v quiet
        env:
          DIGITALBRAIN_E2E_LIVE_MODEL: '0'
          DIGITALBRAIN_E2E_HEADED: '0'

  flutter-web-build:
    name: Flutter analyze and web build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src/DigitalBrain.Modules/Google/Flutter/app/shell
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: src/DigitalBrain.Modules/Google/Flutter/app
        run: flutter pub get --enforce-lockfile

      - name: Dart format
        working-directory: src/DigitalBrain.Modules/Google/Flutter/app
        run: dart format --output=none --set-exit-if-changed core ui shell

      - name: Analyze Flutter packages
        working-directory: src/DigitalBrain.Modules/Google/Flutter/app
        run: |
          (cd core && dart analyze --fatal-infos)
          (cd ui && flutter analyze --no-pub)
          (cd shell && flutter analyze --no-pub)

      - name: Web release build
        run: flutter build web --release --base-href "/" --no-tree-shake-icons --no-pub

      - name: Flutter widget and client tests
        working-directory: src/DigitalBrain.Modules/Google/Flutter/app
        run: |
          (cd ui && flutter test --no-pub)
          (cd shell && flutter test --no-pub)
