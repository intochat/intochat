name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']
  # A dropped push event leaves a master commit without ci, which release.yml requires; rerun it by hand.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

# Build once, then run the PR gate (Unit, Integration, Hosting) as shards of prebuilt test
# modules. Shard membership is by convention from .github/test-shards.json (tier globs, md5 buckets, pins); TestShardFacts holds every PR-gate
# project to exactly one shard. The nightly tiers (E2E, Browser) run in e2e.yml.
jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore NuGet package cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx -v quiet

      - name: Format code
        run: dotnet format whitespace Intochat.OS.slnx --verify-no-changes --no-restore --verbosity minimal

      # framework/ keeps the full format check it had as its own repository (06-00).
      - name: Format framework
        run: dotnet format framework/DigitalBrain.slnx --verify-no-changes --no-restore --verbosity minimal

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The root disk has ~13 GB free and packages plus the solution's output need more (/mnt is the
      # same disk on this image). Cleanup runs in the background during the build instead of 1:38 up front.
      - name: Free the root disk in the background
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - name: Restore NuGet package cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore runs inside the build: one evaluation of the solution instead of two.
      - name: Build solution
        run: dotnet build Intochat.OS.slnx -c Release -v quiet -p:CodeGraphRefresh=false -p:IntoChatOSNightly=false

      - name: Deploy scripts and workflow facts
        run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py'

      - name: Module READMEs are current
        run: dotnet run scripts/module-readmes.cs -- --check

      # Local-profile preflight dry run: fixtures stand in for the machine, so no secrets and no probes of the runner.
      - name: Preflight dry run (all green exits 0)
        run: dotnet run intochat-os.cs preflight --fake src/IntoChat.OS.LocalSetup/IntoChat.OS.LocalSetup.Tests.Unit/fixtures/all-green.json

      - name: Preflight dry run (Windows containers exits 1 and names the fix)
        run: |
          set +e
          output=$(dotnet run intochat-os.cs preflight --fake src/IntoChat.OS.LocalSetup/IntoChat.OS.LocalSetup.Tests.Unit/fixtures/docker-windows-containers.json)
          code=$?
          echo "$output"
          [ "$code" -eq 1 ] || { echo "expected exit 1, got $code"; exit 1; }
          echo "$output" | grep -q "fix:" || { echo "expected a fix line"; exit 1; }

      - name: Preflight real probe (informational)
        continue-on-error: true
        run: dotnet run intochat-os.cs preflight --no-fail

      - name: Save NuGet package cache
        if: steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      # One archive per shard, rooted at artifacts/bin so the test job unpacks it under the checkout:
      # each test output carries its own copy of every dependency, so zstd's long window
      # deduplicates across projects, and native assets for other RIDs are dropped.
      - name: Archive test modules per shard
        run: |
          shards=.github/test-shards.json
          mkdir -p artifacts/shards
          bucket() { echo $(( 16#$(printf '%s' "$1" | md5sum | cut -c1-8) % $2 )); }
          # Golden bucket table: TestShardFacts asserts the same six names and values.
          golden="IntoChat.OS.Kernel.Tests.Integration=1 IntoChat.OS.Modules.Time.Tests.Integration=2 IntoChat.OS.Modules.Postgres.Tests.Integration=3 IntoChat.OS.Modules.ArtCraft.Tests.Integration=0 IntoChat.OS.Modules.Apps.Tests.Integration=1 IntoChat.OS.Client.Orleans.Tests.Integration=3"
          for entry in $golden; do
            [ "$(bucket "${entry%=*}" 4)" = "${entry#*=}" ] || { echo "::error::bucket drift for $entry"; exit 1; }
          done
          rm -f artifacts/shards/*.txt
          for tier in $(jq -r '.tiers | keys[]' "$shards"); do
            n=$(jq -r --arg t "$tier" '.buckets[$t]' "$shards")
            matched=0
            while read -r glob; do
              found=$(find artifacts/bin -mindepth 3 -maxdepth 3 -path '*/release/*' -name "${glob##*/}")
              if [ -z "$found" ]; then echo "::error::$tier: $glob matches no test module"; exit 1; fi
              while read -r dll; do
                project=$(basename "$dll" .dll)
                pin=$(jq -r --arg p "$project" '.pins[$p] // empty' "$shards")
                b=${pin:-$(bucket "$project" "$n")}
                if [ "$n" -eq 1 ]; then shard=$tier; else letters=(a b c d e f g h); shard="$tier-${letters[$b]}"; fi
                echo "$dll" >> "artifacts/shards/$shard.txt"
                matched=$((matched + 1))
              done <<< "$found"
            done < <(jq -r --arg t "$tier" '.tiers[$t][]' "$shards")
            echo "$tier: $matched modules"
          done
          for list in artifacts/shards/*.txt; do
            shard=$(basename "$list" .txt)
            dirs=()
            while read -r dll; do dirs+=("$(dirname "$(dirname "$dll")")"); done < "$list"
            for dir in "${dirs[@]}"; do
              if [ -d "$dir/release/runtimes" ]; then
                find "$dir/release/runtimes" -mindepth 1 -maxdepth 1 -type d ! -name linux-x64 ! -name linux ! -name unix -exec rm -rf {} +
              fi
            done
            archive="artifacts/shards/$shard.tar.zst"
            tar -I 'zstd -T0 -3 --long=30' -cf "$archive" "$list" "${dirs[@]}"
            echo "$shard: ${#dirs[@]} modules, $(du -h "$archive" | cut -f1)"
          done
          df -h /

      # One upload per shard in .github/test-shards.json; a new shard adds a step here and a matrix entry below.
      - uses: actions/upload-artifact@v7
        with:
          name: test-modules-unit
          path: artifacts/shards/unit.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: test-modules-integration-a
          path: artifacts/shards/integration-a.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: test-modules-integration-b
          path: artifacts/shards/integration-b.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: test-modules-integration-c
          path: artifacts/shards/integration-c.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: test-modules-integration-d
          path: artifacts/shards/integration-d.tar.zst
          compression-level: 0
          retention-days: 1

      - name: Validate NuGet packages
        run: |
          dotnet pack Intochat.OS.slnx -c Release --no-build -v quiet -o artifacts/packages

      # The solution build packs the features/os programs; check the built packages.
      - name: Check built-in app packages
        run: python3 scripts/check-app-packages.py compiled-apps/os features/os

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          retention-days: 7

  test:
    name: test (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, integration-a, integration-b, integration-c, integration-d]
    steps:
      # Facts read the repository (the solution, sources, golden files); the modules unpack into artifacts/bin under it.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: test-modules-${{ matrix.shard }}
          path: artifacts/shards

      - name: Unpack test modules
        run: tar -I 'zstd -d --long=30' -xf artifacts/shards/${{ matrix.shard }}.tar.zst

      - name: Resolve shard globs
        id: globs
        run: |
          globs=()
          while read -r dll; do
            [ -f "$dll" ] || { echo "::error::$dll missing from the shard archive"; exit 1; }
            globs+=("$dll")
          done < artifacts/shards/${{ matrix.shard }}.txt
          echo "${#globs[@]} modules"
          echo "value=$(IFS=';'; echo "${globs[*]}")" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --test-modules "${{ steps.globs.outputs.value }}" --max-parallel-test-modules 2 --report-xunit-trx --results-directory "$PWD/artifacts/trx"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trx-${{ matrix.shard }}
          path: artifacts/trx
          retention-days: 7

  # framework/ (the DigitalBrain framework, folded in 06-00) keeps its own build props, so its test output stays under
  # framework/**/bin rather than artifacts/bin and the shard archive never sees it; these jobs carry the former
  # digitalbrain ci: unit, analyzer, testing and runtime facts (framework-test), the e2e (framework-e2e), the template
  # smoke (framework-template) and the DX-04 pack-and-build proof (dx04-packages).
  framework-test:
    name: framework-test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build framework
        run: dotnet build framework/DigitalBrain.slnx -c Release

      # The shared fixture starts Azurite with the SDK compatibility flags and random ports.
      # CI=true makes an unavailable emulator a failure, never a skip.
      - name: Framework unit and integration facts
        run: |
          for project in \
            DigitalBrain.Tests.Unit \
            DigitalBrain.Architecture.Tests.Unit \
            DigitalBrain.Analyzers.Tests.Unit \
            DigitalBrain.Testing.Tests.Unit \
            DigitalBrain.Capabilities.Storage.Tests.Unit \
            DigitalBrain.Capabilities.Secrets.Tests.Unit \
            DigitalBrain.Capabilities.Identity.Tests.Unit \
            DigitalBrain.Runtime.Orleans.Tests.Unit \
            DigitalBrain.Runtime.Http.Tests.Unit \
            DigitalBrain.Runtime.Orleans.Tests.Integration \
            DigitalBrain.Runtime.Orleans.Azure.Tests.Integration; do
            dotnet test --project "framework/tests/$project/$project.csproj" -c Release --no-build
          done

      # The Orleans-free packages stay Orleans-free, transitively.
      - name: No Orleans in the core packages
        run: |
          status=0
          for name in DigitalBrain DigitalBrain.UI DigitalBrain.Testing DigitalBrain.Analyzers; do
            project="framework/src/$name/$name.csproj"
            if dotnet list "$project" package --include-transitive | grep -i orleans; then
              echo "::error::$name references Orleans"
              status=1
            fi
          done
          exit $status

  # Framework e2e (R4-03, 04-15): one fact set on TestOS, the local and the Azurite targets. The skip guard (04-16) fails
  # the job when any result is skipped or no report was written, so the Azurite target can never pass silently.
  framework-e2e:
    name: framework-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Framework e2e facts
        run: dotnet test --project framework/tests/DigitalBrain.Framework.Tests.E2E/DigitalBrain.Framework.Tests.E2E.csproj -c Release --report-xunit-trx --results-directory artifacts/e2e

      - name: No skipped e2e facts
        run: bash framework/scripts/ci/fail-on-skipped.sh artifacts/e2e

  # dotnet new intochat-app / intochat-module outside the repository, from packages packed in this job.
  framework-template:
    name: framework-template
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack framework
        run: |
          dotnet pack framework/DigitalBrain.slnx -c Release -o artifacts/framework-packages
          dotnet pack framework/templates/DigitalBrain.Templates/DigitalBrain.Templates.csproj -c Release -o artifacts/framework-packages

      - name: Template smoke (local)
        run: bash framework/scripts/ci/template-smoke.sh local "$RUNNER_TEMP/t" "$GITHUB_WORKSPACE/artifacts/framework-packages"

      # 08-05: dotnet new intochat-app (Notes, Foo.Bar) into a custom hive, build -warnaserror, generated baseline green, DB0024 probe.
      - name: intochat-app template facts
        env:
          DIGITALBRAIN_TEMPLATE_PACKAGES: ${{ github.workspace }}/artifacts/framework-packages
        run: dotnet test --project framework/tests/DigitalBrain.Templates.Tests.Integration/DigitalBrain.Templates.Tests.Integration.csproj -c Release

  # DX-04: a module author builds and tests with the DigitalBrain packages alone. The Drive module is copied out of the
  # repository, its DigitalBrain ProjectReferences become PackageReferences to the packages packed here, and it builds and
  # runs its unit facts from that folder with nuget.org plus the packed folder as the only sources. An IntoChat.* project
  # reference fails the proof; until Drive drops its os references (module-proof job, 12-12) the script lists them as
  # warnings and stops after the pack, and it turns strict by itself on the first commit where none remain.
  dx04-packages:
    name: dx04-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack framework
        run: dotnet pack framework/DigitalBrain.slnx -c Release -o artifacts/framework-packages

      - name: Build the Drive module from the packages alone
        run: bash scripts/dx04-drive.sh src/IntoChat.OS.Modules/Google/Drive artifacts/framework-packages "$RUNNER_TEMP/dx04"

  # Windows confinement, junctions, trash and uploads must execute on Windows; Linux skips are not provider verification.
  windows-storage:
    name: windows-storage
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Windows storage unit tests
        run: dotnet test --project src/IntoChat.OS.Modules/Microsoft/Windows/tests/IntoChat.OS.Modules.Microsoft.Windows.Tests.Unit/IntoChat.OS.Modules.Microsoft.Windows.Tests.Unit.csproj -c Release -p:CodeGraphRefresh=false --report-xunit-trx --results-directory artifacts/windows-storage-results
      - name: Windows storage runtime and writable conformance
        run: dotnet test --project src/IntoChat.OS.Modules/Microsoft/Windows/tests/IntoChat.OS.Modules.Microsoft.Windows.Tests.Integration/IntoChat.OS.Modules.Microsoft.Windows.Tests.Integration.csproj -c Release -p:CodeGraphRefresh=false --report-xunit-trx --results-directory artifacts/windows-storage-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-storage-results
          path: artifacts/windows-storage-results

  # Informational only: timings never gate a PR. Step-level continue-on-error keeps the job green when the API
  # call or the summary fails; jobs?filter=latest reads the newest attempt of every job, so a rerun of one failed
  # shard reports the whole run instead of only the rerun jobs (attempts/N/jobs lists only that attempt's jobs).
  report:
    name: report
    needs: [format, build, test]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Job timings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "$API" > run.json
          gh api "$API/jobs?filter=latest" --paginate --jq '.jobs[]' | jq -s . > jobs.json
          jq -r --slurpfile run run.json '
            ($run[0].created_at | fromdate) as $t0
            | ["| job | start | end | duration | conclusion |", "|---|---|---|---|---|"][],
              (.[] | select(.completed_at != null)
                | ((.started_at|fromdate) - $t0) as $s | ((.completed_at|fromdate) - $t0) as $e
                | "| \(.name) | +\($s)s | +\($e)s | \(($e - $s) / 60 | floor):\(($e - $s) % 60 | tostring | if length < 2 then "0" + . else . end) | \(.conclusion) |"),
              "",
              ([.[] | select(.completed_at != null) | (.completed_at|fromdate) - $t0] | max
                | "Critical path (run created to last finished job): \(. / 60 | floor):\(. % 60 | tostring | if length < 2 then "0" + . else . end)")
          ' jobs.json >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: ci
    needs: [format, build, test, framework-test, framework-e2e, framework-template, dx04-packages, windows-storage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "format=${{ needs.format.result }} build=${{ needs.build.result }} test=${{ needs.test.result }}"
          echo "framework-test=${{ needs.framework-test.result }} framework-e2e=${{ needs.framework-e2e.result }} framework-template=${{ needs.framework-template.result }} dx04-packages=${{ needs.dx04-packages.result }}"
          echo "windows-storage=${{ needs.windows-storage.result }}"
          exit 1

  # Prerelease packages to GitHub Packages, only after the aggregate ci job succeeded on a master push.
  publish:
    name: publish
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore NuGet package cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx

      # Intochat.OS.slnx holds framework/ (06-00), so DigitalBrain.* pack here with the same pre.<run> suffix and the
      # IntoChat.OS.* dependency on DigitalBrain resolves from the same feed.
      - name: Pack prerelease packages
        run: dotnet pack Intochat.OS.slnx -c Release --no-restore -o artifacts -p:CodeGraphRefresh=false -p:VersionSuffix=pre.${{ github.run_number }}

      # Separate from pack so --skip-duplicate cannot mask a pack failure.
      - name: Push packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://nuget.pkg.github.com/intochat/index.json --api-key "${GITHUB_TOKEN}" --skip-duplicate
