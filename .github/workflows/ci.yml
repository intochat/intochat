name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']
  # A dropped push event leaves a master commit without ci, which release.yml requires; rerun it by hand.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx -v quiet

      - name: Format code
        run: dotnet format whitespace Intochat.OS.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Module READMEs are current
        run: dotnet run scripts/module-readmes.cs -- --check

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Free the root disk in the background
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config

      - name: Build solution
        run: |
          dotnet build src/IntoChat.OS.Kernel/IntoChat.OS.Kernel/IntoChat.OS.Kernel.csproj -c Release -v quiet -p:CodeGraphRefresh=false
          dotnet build src/IntoChat.OS.AppHost/IntoChat.OS.AppHost.csproj -c Release -v quiet -p:CodeGraphRefresh=false

      - name: Deploy scripts and workflow facts
        run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py'

      - name: Validate NuGet packages
        run: |
          for project in $(grep -rl '<IsPackable>true</IsPackable>' src | sort); do
            dotnet pack "$project" -c Release -v quiet -o artifacts/packages -p:CodeGraphRefresh=false
          done

  facts:
    name: facts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config
      - name: Test (Unit)
        run: dotnet test --solution Intochat.OS.slnx -c Release -p:IntoChatOSNightly=false -p:IntoChatOSOnlyTier=Unit -p:CodeGraphRefresh=false

  runtime:
    name: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config
      - name: Test (Integration)
        run: dotnet test --solution Intochat.OS.slnx -c Release -p:IntoChatOSNightly=false -p:IntoChatOSOnlyTier=Integration -p:CodeGraphRefresh=false

  product:
    name: product
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config
      - name: Test (Product E2E)
        run: |
          # --filter "needs!=artcraft" (MTP: --filter-not-trait "needs=artcraft")
          dotnet test --project src/IntoChat.OS.Kernel/IntoChat.OS.Kernel.Tests.E2E/IntoChat.OS.Kernel.Tests.E2E.csproj -c Release -p:IntoChatOSNightly=false -p:CodeGraphRefresh=false -- --filter-not-trait "needs=artcraft"
          dotnet test --project src/IntoChat.OS.Kernel/IntoChat.OS.Kernel.Tests.E2E.Aspire/IntoChat.OS.Kernel.Tests.E2E.Aspire.csproj -c Release -p:IntoChatOSNightly=false -p:CodeGraphRefresh=false -- --filter-not-trait "needs=artcraft"

  # Blob storage@1 against Azurite. The default Integration tier skips when port 10000 is closed.
  blob-storage:
    name: blob-storage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Start Azurite
        run: docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite azurite-blob -l /data --blobHost 0.0.0.0 --skipApiVersionCheck
      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config
      - name: Blob storage conformance
        run: dotnet test --project src/IntoChat.Cloud/Modules/Blob/tests/IntoChat.Cloud.Blob.Tests.Integration/IntoChat.Cloud.Blob.Tests.Integration.csproj -c Release -p:CodeGraphRefresh=false

  # Informational only: timings never gate a PR. Step-level continue-on-error keeps the job green when the API
  # call or the summary fails; jobs?filter=latest reads the newest attempt of every job, so a rerun of one failed
  # tier job reports the whole run instead of only the rerun jobs (attempts/N/jobs lists only that attempt's jobs).
  report:
    name: report
    needs: [format, build, facts, runtime, product, blob-storage]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Job timings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "$API" > run.json
          gh api "$API/jobs?filter=latest" --paginate --jq '.jobs[]' | jq -s . > jobs.json
          jq -r --slurpfile run run.json '
            ($run[0].created_at | fromdate) as $t0
            | ["| job | start | end | duration | conclusion |", "|---|---|---|---|---|"][],
              (.[] | select(.completed_at != null)
                | ((.started_at|fromdate) - $t0) as $s | ((.completed_at|fromdate) - $t0) as $e
                | "| \(.name) | +\($s)s | +\($e)s | \(($e - $s) / 60 | floor):\(($e - $s) % 60 | tostring | if length < 2 then "0" + . else . end) | \(.conclusion) |"),
              "",
              ([.[] | select(.completed_at != null) | (.completed_at|fromdate) - $t0] | max
                | "Critical path (run created to last finished job): \(. / 60 | floor):\(. % 60 | tostring | if length < 2 then "0" + . else . end)")
          ' jobs.json >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: ci
    needs: [format, build, facts, runtime, product, blob-storage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "format=${{ needs.format.result }} build=${{ needs.build.result }} facts=${{ needs.facts.result }} runtime=${{ needs.runtime.result }} product=${{ needs.product.result }} blob-storage=${{ needs.blob-storage.result }}"
          exit 1

  # Prerelease packages to GitHub Packages, only after the aggregate ci job succeeded on a master push.
  publish:
    name: publish
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx -v quiet

      - name: Pack prerelease packages
        run: dotnet pack Intochat.OS.slnx -c Release --no-restore -o artifacts -p:CodeGraphRefresh=false -p:VersionSuffix=pre.${{ github.run_number }}

      # Separate from pack so --skip-duplicate cannot mask a pack failure.
      - name: Push packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://nuget.pkg.github.com/intochat/index.json --api-key "${GITHUB_TOKEN}" --skip-duplicate
