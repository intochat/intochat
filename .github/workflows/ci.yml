name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      flutter: ${{ steps.filter.outputs.flutter }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - name: Classify changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          dotnet=false
          flutter=false
          packaging=false

          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            dotnet=true
            flutter=true
            packaging=true
          else
            files=""
            fail_closed=false

            if [ "$EVENT_NAME" = "pull_request" ]; then
              if ! files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"; then
                fail_closed=true
              fi
            else
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                fail_closed=true
              else
                if ! files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PUSH_BEFORE}...${PUSH_AFTER}" --jq '.files[].filename')"; then
                  fail_closed=true
                else
                  count="$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)"
                  if [ "$count" -ge 300 ]; then
                    fail_closed=true
                  fi
                fi
              fi
            fi

            if [ "$fail_closed" = "true" ] || [ -z "$files" ]; then
              dotnet=true
              flutter=true
              packaging=true
            else
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  ui/*|.github/workflows/ci.yml)
                    flutter=true
                    ;;
                esac
                case "$f" in
                  intochat.cs|VERSION|global.json|Directory.*.props|*.slnx|*.csproj|src/IntoChat.OS.Desktop/*|eng/*|.github/workflows/ci.yml|.github/workflows/release.yml)
                    packaging=true
                    ;;
                esac
                case "$f" in
                  ui/*|docs/*|*.md|.agents/*|.vscode/*|artcraft\ logos/*|LICENSE*)
                    ;;
                  *)
                    dotnet=true
                    ;;
                esac
              done <<< "$files"
            fi
          fi

          echo "dotnet=$dotnet" >> "$GITHUB_OUTPUT"
          echo "flutter=$flutter" >> "$GITHUB_OUTPUT"
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"
          echo "Detected changes: dotnet=$dotnet flutter=$flutter packaging=$packaging"

  lint-and-security:
    name: lint-and-security
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks

      - name: Scan commits with gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts="${BASE_SHA}..HEAD" --redact --verbose --config .gitleaks.toml --baseline-path .gitleaks-baseline.json
          else
            "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --redact --verbose --config .gitleaks.toml --baseline-path .gitleaks-baseline.json
          fi

      - if: needs.changes.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        if: needs.changes.outputs.dotnet == 'true'
        run: dotnet restore Intochat.OS.slnx -v quiet -p:RestoreUseStaticGraphEvaluation=true

      - name: Check no Orleans in core framework packages
        if: needs.changes.outputs.dotnet == 'true'
        run: |
          status=0
          for name in DigitalBrain DigitalBrain.Simulation DigitalBrain.UI DigitalBrain.Testing DigitalBrain.Analyzers DigitalBrain.Capabilities.Storage DigitalBrain.Capabilities.Secrets DigitalBrain.Capabilities.Identity DigitalBrain.Capabilities.Compute DigitalBrain.Capabilities.Connections DigitalBrain.Capabilities.Http DigitalBrain.Capabilities.Tools DigitalBrain.Identity.Local DigitalBrain.Runtime.Http; do
            project="framework/src/$name/$name.csproj"
            if dotnet list "$project" package --include-transitive | grep -i orleans; then
              echo "::error::$name references Orleans"
              status=1
            fi
          done
          exit $status

      - name: Format check
        if: needs.changes.outputs.dotnet == 'true'
        run: dotnet format whitespace Intochat.OS.slnx --verify-no-changes --no-restore --verbosity minimal

  build:
    name: build
    needs: [changes]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Free root disk in the background
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx -v quiet -p:RestoreUseStaticGraphEvaluation=true

      - name: Build solution
        run: dotnet build Intochat.OS.slnx -c Release --no-restore -p:CodeGraphRefresh=false -p:DebugType=none

      - name: Pack DigitalBrain and IntoChat.OS packages
        run: |
          dotnet pack Intochat.OS.slnx -c Release --no-build -o artifacts/packages -p:CodeGraphRefresh=false -p:DebugType=none -p:IncludeSymbols=false

      - name: Prune non-Linux native runtimes and nightly browser tests from compiled artifacts
        run: |
          du -sh artifacts/bin
          find artifacts/bin -mindepth 4 -maxdepth 4 -path '*/runtimes/*' -type d \
            ! -name 'linux-x64' ! -name 'linux' ! -name 'unix' -exec rm -rf {} +
          rm -rf artifacts/bin/*/*/.playwright/node/win* artifacts/bin/*/*/.playwright/node/darwin*
          rm -rf artifacts/bin/*.Tests.Browser
          du -sh artifacts/bin

      - name: Upload DigitalBrain packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          compression-level: 1
          retention-days: 1

      - name: Upload unit test artifacts
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-artifacts
          path: |
            artifacts/bin/*.Tests.Unit
            artifacts/obj/*/project.assets.json
          compression-level: 1
          retention-days: 1

      - name: Drop unit test binaries from integration/E2E artifacts
        run: rm -rf artifacts/bin/*.Tests.Unit

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compiled-artifacts
          path: artifacts/bin
          compression-level: 1
          retention-days: 1

  test-unit:
    name: test-unit
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: unit-test-artifacts
          path: artifacts

      - name: Make artifacts executable
        run: chmod -R +x artifacts/bin

      - name: Test (Architecture Tier — MTP)
        run: dotnet test --test-modules "artifacts/bin/*.Architecture.Tests.Unit/release/*.Architecture.Tests.Unit.dll" --max-parallel-test-modules 8

      - name: Test (Unit Tier — MTP)
        run: |
          rm -rf artifacts/bin/*.Architecture.Tests.Unit
          dotnet test --test-modules "artifacts/bin/*.Tests.Unit/release/*.Tests.Unit.dll" --max-parallel-test-modules 8

  test-integration-os:
    name: test-integration-os (${{ matrix.shard }}/2)
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            filter_arg: '--filter-namespace'
            filter_value: 'IntoChat.OS.Modules.*'
          - shard: 2
            filter_arg: '--filter-not-namespace'
            filter_value: 'IntoChat.OS.Modules.*'
    env:
      AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: intochat-test-password
          POSTGRES_USER: postgres
          POSTGRES_DB: intochat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Free root disk in the background
        run: |
          mkdir -p ~/.nuget/packages
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      # A service container cannot pass arguments, and Azurite refuses newer storage API versions without this flag.
      - name: Start Azurite
        run: docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 mcr.microsoft.com/azure-storage/azurite azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: compiled-artifacts
          path: artifacts/bin

      - name: Make artifacts executable
        run: chmod -R +x artifacts/bin

      - name: Test (IntoChat.OS Integration Tier — MTP shard ${{ matrix.shard }}/2)
        run: dotnet test --test-modules "artifacts/bin/IntoChat.OS.Tests.Integration/release/IntoChat.OS.Tests.Integration.dll" --max-parallel-test-modules 8 -- ${{ matrix.filter_arg }} "${{ matrix.filter_value }}"

  test-framework:
    name: test-framework
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
    steps:
      - uses: actions/checkout@v7

      - name: Free root disk in the background
        run: |
          mkdir -p ~/.nuget/packages
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - name: Start Azurite
        run: docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 mcr.microsoft.com/azure-storage/azurite azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - uses: actions/download-artifact@v8
        with:
          name: compiled-artifacts
          path: artifacts/bin

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Make artifacts executable
        run: chmod -R +x artifacts/bin

      - name: Test (DigitalBrain Integration Tier — MTP)
        env:
          DIGITALBRAIN_TEMPLATE_PACKAGES: ${{ github.workspace }}/artifacts/packages
        run: dotnet test --test-modules "artifacts/bin/DigitalBrain*.Tests.Integration/release/DigitalBrain*.Tests.Integration.dll" --max-parallel-test-modules 8

      - name: Test (DigitalBrain Framework E2E — MTP)
        run: dotnet test --test-modules "artifacts/bin/DigitalBrain.Framework.Tests.E2E/release/DigitalBrain.Framework.Tests.E2E.dll" --max-parallel-test-modules 8

  e2e-os:
    name: e2e-os
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
      INTOCHATOS__KERNEL_BINARY: ${{ github.workspace }}/artifacts/bin/IntoChat.OS.Kernel/release/IntoChat.OS.Kernel
    steps:
      - uses: actions/checkout@v7

      - name: Free root disk in the background
        run: |
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - name: Start Azurite
        run: docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 mcr.microsoft.com/azure-storage/azurite azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: compiled-artifacts
          path: artifacts/bin

      - name: Make artifacts executable
        run: chmod -R +x artifacts/bin

      - name: Cache Aspire DCP
        id: cache-dcp
        uses: actions/cache@v6
        with:
          path: ~/.aspire/bundle/dcp
          key: aspire-dcp-linux-x64-13.6.1

      - name: Provision Aspire DCP
        if: steps.cache-dcp.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.aspire/bundle/dcp
          curl -sSL https://api.nuget.org/v3-flatcontainer/aspire.hosting.orchestration.linux-x64/13.6.1/aspire.hosting.orchestration.linux-x64.13.6.1.nupkg -o /tmp/dcp.zip
          unzip -q -o -j /tmp/dcp.zip "tools/*" -d ~/.aspire/bundle/dcp/
          chmod +x ~/.aspire/bundle/dcp/dcp ~/.aspire/bundle/dcp/dcptun_c
          rm -f /tmp/dcp.zip

      - name: Test IntoChat.OS E2E (MTP)
        run: dotnet test --test-modules "artifacts/bin/IntoChat.OS.Tests.E2E/release/IntoChat.OS.Tests.E2E.dll" --max-parallel-test-modules 8

  flutter:
    name: flutter
    needs: [changes]
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Dart format check
        working-directory: ui
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter package
        working-directory: ui
        run: dart analyze --fatal-infos

      - name: Flutter tests
        working-directory: ui
        run: flutter test --no-pub --exclude-tags golden --concurrency=4

  # The release workflow packages all 5 platforms with eng/package.cs. The dry run checks, on the runner image the
  # release uses, that every project it publishes is where it looks.
  package-dry-run:
    name: package-dry-run
    needs: [changes]
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Dry-run the release packaging script
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run eng/package.cs --platform win-x64 --version 0.24.0 --dry-run
          dotnet run eng/package.cs --platform linux-x64 --version 0.24.0 --dry-run
          dotnet run eng/package.cs --platform osx-arm64 --version 0.24.0 --dry-run
          dotnet run eng/package.cs --platform android --version 0.24.0 --dry-run
          dotnet run eng/package.cs --platform ios --version 0.24.0 --dry-run

  ci:
    name: ci
    needs: [changes, lint-and-security, build, test-unit, test-integration-os, test-framework, e2e-os, flutter, package-dry-run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "changes=${{ needs.changes.result }} lint-and-security=${{ needs.lint-and-security.result }} build=${{ needs.build.result }} test-unit=${{ needs.test-unit.result }} test-integration-os=${{ needs.test-integration-os.result }} test-framework=${{ needs.test-framework.result }} e2e-os=${{ needs.e2e-os.result }} flutter=${{ needs.flutter.result }} package-dry-run=${{ needs.package-dry-run.result }}"
          exit 1
