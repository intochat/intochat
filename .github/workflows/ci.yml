name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Free space for native dependencies and container builds
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Restore NuGet package cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore DigitalBrain.slnx -v quiet

      - name: Format code
        run: dotnet format whitespace DigitalBrain.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build solution
        run: dotnet build DigitalBrain.slnx -c Release --no-restore -v quiet -p:CodeGraphRefresh=false

      - name: Validate NuGet packages
        run: dotnet pack DigitalBrain.slnx -c Release --no-build -v quiet -o artifacts

      # E2E projects need containers; they run in e2e.yml on master and nightly.
      - name: Test
        run: dotnet test -c Release --no-build -p:DigitalBrainE2E=false

      - name: Save NuGet package cache
        if: github.ref == 'refs/heads/master' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
