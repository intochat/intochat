name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks

      - name: Scan history with gitleaks
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --redact --verbose --config .gitleaks.toml --baseline-path .gitleaks-baseline.json'

      - name: Free root disk in the background
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx -v quiet

      - name: Check no Orleans in core framework packages
        run: |
          status=0
          for name in DigitalBrain DigitalBrain.Simulation DigitalBrain.UI DigitalBrain.Testing DigitalBrain.Analyzers DigitalBrain.Capabilities.Storage DigitalBrain.Capabilities.Secrets DigitalBrain.Capabilities.Identity DigitalBrain.Capabilities.Compute DigitalBrain.Capabilities.Connections DigitalBrain.Capabilities.Http DigitalBrain.Capabilities.Tools DigitalBrain.Identity.Local DigitalBrain.Runtime.Http; do
            project="framework/src/$name/$name.csproj"
            if dotnet list "$project" package --include-transitive | grep -i orleans; then
              echo "::error::$name references Orleans"
              status=1
            fi
          done
          exit $status

      - name: Format check
        run: dotnet format whitespace Intochat.OS.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build solution
        run: dotnet build Intochat.OS.slnx -c Release --no-restore -p:CodeGraphRefresh=false -p:DebugType=none

      - name: Pack DigitalBrain and IntoChat.OS packages
        run: |
          dotnet pack Intochat.OS.slnx -c Release --no-build -o artifacts/packages -p:CodeGraphRefresh=false -p:DebugType=none -p:IncludeSymbols=false

      - name: Upload DigitalBrain packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          compression-level: 1
          retention-days: 1

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compiled-artifacts
          path: artifacts/bin
          compression-level: 1
          retention-days: 1

  test-unit:
    name: test-unit
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Free root disk in the background
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - uses: actions/download-artifact@v8
        with:
          name: compiled-artifacts
          path: artifacts/bin

      - name: Make artifacts executable
        run: chmod -R +x artifacts/bin

      - name: Restore framework graph for architecture facts
        run: dotnet restore framework/DigitalBrain.slnx -v quiet

      - name: Test (Unit Tier)
        run: dotnet test --solution Intochat.OS.slnx -c Release --no-build -p:IntoChatOSNightly=false -p:IntoChatOSOnlyTier=Unit -p:CodeGraphRefresh=false

  test-integration:
    name: test-integration
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: intochat-test-password
          POSTGRES_USER: postgres
          POSTGRES_DB: intochat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      # A service container cannot pass arguments, and Azurite refuses newer storage API versions without this flag.
      - name: Start Azurite
        run: docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 mcr.microsoft.com/azure-storage/azurite azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

      - name: Free root disk in the background
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - uses: actions/download-artifact@v8
        with:
          name: compiled-artifacts
          path: artifacts/bin

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Make artifacts executable
        run: chmod -R +x artifacts/bin

      - name: Test (Integration Tier)
        env:
          DIGITALBRAIN_TEMPLATE_PACKAGES: ${{ github.workspace }}/artifacts/packages
        run: dotnet test --solution Intochat.OS.slnx -c Release --no-build -p:IntoChatOSNightly=false -p:IntoChatOSOnlyTier=Integration -p:CodeGraphRefresh=false

  e2e:
    name: e2e
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
    steps:
      - uses: actions/checkout@v7

      # A service container cannot pass arguments, and Azurite refuses newer storage API versions without this flag.
      - name: Start Azurite
        run: docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 mcr.microsoft.com/azure-storage/azurite azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

      - name: Free root disk in the background
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - uses: actions/download-artifact@v8
        with:
          name: compiled-artifacts
          path: artifacts/bin

      - name: Make artifacts executable
        run: chmod -R +x artifacts/bin

      - name: Provision Aspire DCP
        run: |
          mkdir -p ~/.aspire/bundle/dcp
          curl -sSL https://api.nuget.org/v3-flatcontainer/aspire.hosting.orchestration.linux-x64/13.6.1/aspire.hosting.orchestration.linux-x64.13.6.1.nupkg -o /tmp/dcp.zip
          unzip -q -o -j /tmp/dcp.zip "tools/*" -d ~/.aspire/bundle/dcp/
          chmod +x ~/.aspire/bundle/dcp/dcp ~/.aspire/bundle/dcp/dcptun_c
          rm -f /tmp/dcp.zip

      - name: Restore solution for Aspire AppHost project builds
        run: dotnet restore Intochat.OS.slnx -v quiet

      - name: Prepare Kernel build state
        run: dotnet build src/IntoChat.OS.Kernel/IntoChat.OS.Kernel.csproj -c Release --no-restore -p:CodeGraphRefresh=false --nologo -v minimal

      - name: Test E2E
        run: dotnet test --project tests/IntoChat.OS.Tests.E2E/IntoChat.OS.Tests.E2E.csproj -c Release --no-build -p:CodeGraphRefresh=false

      - name: Test Framework E2E
        run: dotnet test --project framework/tests/DigitalBrain.Framework.Tests.E2E/DigitalBrain.Framework.Tests.E2E.csproj -c Release --no-build -p:CodeGraphRefresh=false

  flutter:
    name: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Dart format check
        working-directory: ui
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter package
        working-directory: ui
        run: dart analyze --fatal-infos

      - name: Flutter tests
        working-directory: ui
        run: flutter test --no-pub --exclude-tags golden --concurrency=4

  # The release workflow packages the Windows bundle with AppHost package-release. The dry run checks, on the runner image the
  # release uses, that every project it publishes is where it looks.
  package-dry-run:
    name: package-dry-run
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Dry-run the Windows release packaging
        shell: pwsh
        run: dotnet run intochat-os.cs -- package-dry-run --rid win-x64

  ci:
    name: ci
    needs: [build, test-unit, test-integration, e2e, flutter, package-dry-run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "build=${{ needs.build.result }} test-unit=${{ needs.test-unit.result }} test-integration=${{ needs.test-integration.result }} e2e=${{ needs.e2e.result }} flutter=${{ needs.flutter.result }} package-dry-run=${{ needs.package-dry-run.result }}"
          exit 1
