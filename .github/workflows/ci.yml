name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

# Build once, then run the PR gate (Unit, Integration, Hosting) as shards of prebuilt test
# modules. Shard membership lives in .github/test-shards.json; TestShardFacts holds every PR-gate
# project to exactly one shard. The nightly tiers (E2E, Browser) run in e2e.yml.
jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore NuGet package cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx -v quiet

      - name: Format code
        run: dotnet format whitespace Intochat.OS.slnx --verify-no-changes --no-restore --verbosity minimal

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The root disk has ~13 GB free and packages plus the solution's output need more (/mnt is the
      # same disk on this image). Cleanup runs in the background during the build instead of 1:38 up front.
      - name: Free the root disk in the background
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - name: Restore NuGet package cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore runs inside the build: one evaluation of the solution instead of two.
      - name: Build solution
        run: dotnet build Intochat.OS.slnx -c Release -v quiet -p:CodeGraphRefresh=false -p:IntoChatOSNightly=false

      - name: Save NuGet package cache
        if: steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      # One archive per shard, rooted at artifacts/bin so the test job unpacks it under the checkout:
      # each test output carries its own copy of every dependency, so zstd's long window
      # deduplicates across projects, and native assets for other RIDs are dropped.
      - name: Archive test modules per shard
        run: |
          shards=.github/test-shards.json
          mkdir -p artifacts/shards
          for shard in $(jq -r '.shards | keys[]' "$shards"); do
            dirs=()
            while read -r glob; do
              found=$(find artifacts/bin -mindepth 3 -maxdepth 3 -path '*/release/*' -name "${glob##*/}")
              if [ -z "$found" ]; then echo "::error::$shard: $glob matches no test module"; exit 1; fi
              while read -r dll; do dirs+=("$(dirname "$(dirname "$dll")")"); done <<< "$found"
            done < <(jq -r --arg s "$shard" '.shards[$s][]' "$shards")
            for dir in "${dirs[@]}"; do
              if [ -d "$dir/release/runtimes" ]; then
                find "$dir/release/runtimes" -mindepth 1 -maxdepth 1 -type d ! -name linux-x64 ! -name linux ! -name unix -exec rm -rf {} +
              fi
            done
            archive="artifacts/shards/$shard.tar.zst"
            tar -I 'zstd -T0 -3 --long=30' -cf "$archive" "${dirs[@]}"
            echo "$shard: ${#dirs[@]} modules, $(du -h "$archive" | cut -f1)"
          done
          df -h /

      # One upload per shard in .github/test-shards.json; a new shard adds a step here and a matrix entry below.
      - uses: actions/upload-artifact@v7
        with:
          name: test-modules-unit
          path: artifacts/shards/unit.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: test-modules-integration-a
          path: artifacts/shards/integration-a.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: test-modules-integration-b
          path: artifacts/shards/integration-b.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: test-modules-integration-c
          path: artifacts/shards/integration-c.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: test-modules-integration-d
          path: artifacts/shards/integration-d.tar.zst
          compression-level: 0
          retention-days: 1

      - name: Validate NuGet packages
        run: dotnet pack Intochat.OS.slnx -c Release --no-build -v quiet -o artifacts/packages

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          retention-days: 7

  test:
    name: test (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, integration-a, integration-b, integration-c, integration-d]
    steps:
      # Facts read the repository (the solution, sources, golden files); the modules unpack into artifacts/bin under it.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: test-modules-${{ matrix.shard }}
          path: artifacts/shards

      - name: Unpack test modules
        run: tar -I 'zstd -d --long=30' -xf artifacts/shards/${{ matrix.shard }}.tar.zst

      - name: Resolve shard globs
        id: globs
        run: |
          globs=()
          while read -r glob; do
            count=$(find artifacts/bin -mindepth 3 -maxdepth 3 -path '*/release/*' -name "${glob##*/}" | wc -l)
            echo "$glob -> $count"
            if [ "$count" -eq 0 ]; then echo "::error::$glob matches no test module"; exit 1; fi
            globs+=("artifacts/bin/$glob")
          done < <(jq -r --arg s "${{ matrix.shard }}" '.shards[$s][]' .github/test-shards.json)
          echo "value=$(IFS=';'; echo "${globs[*]}")" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --test-modules "${{ steps.globs.outputs.value }}" --max-parallel-test-modules 2 --report-xunit-trx --results-directory "$PWD/artifacts/trx"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trx-${{ matrix.shard }}
          path: artifacts/trx
          retention-days: 7

  # Informational only: timings never gate a PR. Step-level continue-on-error keeps the job green when the API
  # call or the summary fails; jobs?filter=latest reads the newest attempt of every job, so a rerun of one failed
  # shard reports the whole run instead of only the rerun jobs (attempts/N/jobs lists only that attempt's jobs).
  report:
    name: report
    needs: [format, build, test]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Job timings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "$API" > run.json
          gh api "$API/jobs?filter=latest" --paginate --jq '.jobs[]' | jq -s . > jobs.json
          jq -r --slurpfile run run.json '
            ($run[0].created_at | fromdate) as $t0
            | ["| job | start | end | duration | conclusion |", "|---|---|---|---|---|"][],
              (.[] | select(.completed_at != null)
                | ((.started_at|fromdate) - $t0) as $s | ((.completed_at|fromdate) - $t0) as $e
                | "| \(.name) | +\($s)s | +\($e)s | \(($e - $s) / 60 | floor):\(($e - $s) % 60 | tostring | if length < 2 then "0" + . else . end) | \(.conclusion) |"),
              "",
              ([.[] | select(.completed_at != null) | (.completed_at|fromdate) - $t0] | max
                | "Critical path (run created to last finished job): \(. / 60 | floor):\(. % 60 | tostring | if length < 2 then "0" + . else . end)")
          ' jobs.json >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: ci
    needs: [format, build, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "format=${{ needs.format.result }} build=${{ needs.build.result }} test=${{ needs.test.result }}"
          exit 1
