name: e2e

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IntoChatOS__Modules__artcraft__Options__ImageRegistry: ghcr.io/intochat
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Free space for native dependencies and container builds
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/miniconda /opt/az /opt/microsoft/msedge /usr/lib/jvm /usr/local/julia*
          docker image prune --all --force > /dev/null
          # The four ArtCraft Rust builds alone outgrow the root disk; docker's data goes to the runner's /mnt disk.
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } | jq '. + {"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json.new > /dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - name: Restore NuGet package cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx -v quiet

      - name: Build solution
        run: dotnet build Intochat.OS.slnx -c Release -v quiet -p:CodeGraphRefresh=false

      # The AppHosts build the shell and sandbox images themselves; these run the SAME Dockerfiles
      # over the SAME contexts, so the in-test builds hit a warm layer cache instead of a cold build
      # inside a fact's HTTP timeout.
      - name: Warm the shell image layer cache
        run: docker build -f ui/shell/Dockerfile ui

      - name: Check out intochat/modules for sandbox Dockerfile
        uses: actions/checkout@v7
        with:
          repository: intochat/modules
          path: modules

      - name: Warm the sandbox image layer cache
        run: docker build -f modules/src/IntoChat.OS.Modules/Microsoft/CSharp/src/IntoChat.OS.Modules.Microsoft.CSharp.Sandbox/Dockerfile modules

      # ArtCraft images are built once per pinned ref by artcraft-images.yml and pulled here; the tags are the first
      # 12 characters of the refs in ArtCraftModuleHosting (E2EWarmUpFacts pins them). A missing tag fails the step:
      # run artcraft-images.yml first.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the ArtCraft images
        run: |
          for image in             ghcr.io/intochat/os-artcraft-photocraft-mcp:d7d5c6069c8f             ghcr.io/intochat/os-artcraft-photocraft-web:d7d5c6069c8f             ghcr.io/intochat/os-artcraft-filmcraft-mcp:7b6c13447228             ghcr.io/intochat/os-artcraft-filmcraft-web:7b6c13447228; do
            docker pull "$image"
            docker inspect --format '{{index .RepoDigests 0}}' "$image"
          done

      - name: Test Framework E2E
        run: dotnet test --project framework/tests/DigitalBrain.Framework.Tests.E2E/DigitalBrain.Framework.Tests.E2E.csproj -c Release --no-build

  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Free space for the full nightly build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/miniconda /opt/az /opt/microsoft/msedge /usr/lib/jvm /usr/local/julia*
          docker image prune --all --force > /dev/null
          df -h /

      - name: Restore NuGet package cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx -v quiet

      - name: Build solution
        run: dotnet build Intochat.OS.slnx -c Release --no-restore -v quiet -p:CodeGraphRefresh=false -p:IntoChatOSNightly=true

      # Ubuntu 24.04 blocks unprivileged user namespaces; Chromium's sandbox (kept on in product code) needs them.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Playwright browsers
        run: pwsh artifacts/bin/IntoChat.OS.Modules.Microsoft.Playwright.Tests.Browser/release/playwright.ps1 install --with-deps chromium

      - name: Test Browser
        run: |
          count=$(find artifacts/bin -mindepth 3 -maxdepth 3 -path '*/release/*' -name '*.Tests.Browser.dll' | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::no Browser test module was built"; exit 1; fi
          dotnet test --test-modules "artifacts/bin/**/*.Tests.Browser.dll"

  # Nightly red blocks tags, not merges: record it on one issue per day.
  nightly-red:
    name: nightly red
    needs: [e2e, browser]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - name: Open or update the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="nightly red: $(date -u +%F)"
          body="$GITHUB_WORKFLOW failed on ${GITHUB_SHA::9} (${{ github.event_name }}): $RUN_URL"
          number=$(gh issue list --state open --limit 50 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"
          else gh label create nightly --force --color B60205 --description "Nightly E2E/Browser failure" > /dev/null
            gh issue create --title "$title" --body "$body" --label nightly; fi
