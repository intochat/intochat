name: release

# Agents: do not run this workflow, and do not push the tag yourself.
# Create a GitHub release whose tag is v<VERSION> (the VERSION file). Publishing that
# release starts this workflow. It packs, pushes packages and GHCR images, and uploads
# the packages onto that release. No tests: ci.yml owns them.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  checks: read
  actions: read
  issues: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  e2e-latest:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
  release:
    name: release
    needs: [ci, e2e-latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Releases only ship commits the ci aggregate job passed.
      - name: Require ci success for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '[.check_runs[]|select(.name=="ci" or .name=="ci / ci")|.conclusion]|index("success")')"
          [ "${ok}" != "null" ] && [ -n "${ok}" ] || { echo "::error::ci has not succeeded for this commit"; exit 1; }

      # Must stay first: nothing is logged in, packed or pushed for a mismatched tag.
      - name: Guard tag matches VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Free space for native dependencies and container builds
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config

      - name: Restore dependencies
        run: dotnet restore Intochat.OS.slnx

      - name: Pack release packages
        run: dotnet pack Intochat.OS.slnx -c Release --no-restore -o artifacts -p:CodeGraphRefresh=false

      # Separate from pack so --skip-duplicate cannot mask a pack failure.
      - name: Push packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://nuget.pkg.github.com/intochat/index.json --api-key "${GITHUB_TOKEN}" --skip-duplicate

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry and repository (ghcr.io/intochat/os) come from Properties/PublishProfiles/Container.pubxml.
      - name: Publish kernel image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/IntoChat.OS.Kernel/IntoChat.OS.Kernel/IntoChat.OS.Kernel.csproj \
            -c Release -r linux-x64 /t:PublishContainer \
            -p:PublishProfile=Container \
            -p:EnableSdkContainerSupport=true \
            -p:CodeGraphRefresh=false \
            -p:ContainerImageTags="${VERSION}%3Blatest"

      - name: Publish UI image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build -f ui/shell/Dockerfile \
            -t ghcr.io/intochat/os-ui:${VERSION} \
            -t ghcr.io/intochat/os-ui:latest \
            ui
          docker push --all-tags ghcr.io/intochat/os-ui

      # Built from the same commit as the kernel, so its contracts match the brains that run its sessions.
      - name: Publish sandbox image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUGET_GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          docker build --secret id=nuget,env=NUGET_GITHUB_TOKEN \
            -f src/IntoChat.OS.Modules/Microsoft/CSharp/src/IntoChat.OS.Modules.Microsoft.CSharp.Sandbox/Dockerfile \
            -t ghcr.io/intochat/os-sandbox:${VERSION} \
            -t ghcr.io/intochat/os-sandbox:latest .
          bash scripts/check-sandbox-image.sh "ghcr.io/intochat/os-sandbox:${VERSION}"
          docker push --all-tags ghcr.io/intochat/os-sandbox

      # The release already exists: publishing it is what started this workflow.
      - name: Upload packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" artifacts/*.nupkg --clobber
