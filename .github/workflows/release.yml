name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: 'Tag of the prior release to roll back to (e.g. v0.14.1)'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  checks: read
  actions: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  package:
    name: package
    if: inputs.rollback_tag == '' || inputs.rollback_tag == null
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free root disk in the background
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - name: Verify CI check-run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '[.check_runs[]|select(.name=="ci" or .name=="ci / ci")|.conclusion]|index("success")')"
          [ "${ok}" != "null" ] && [ -n "${ok}" ] || { echo "::error::ci has not succeeded for commit ${{ github.sha }}"; exit 1; }

      - name: Guard tag matches VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.event_name }}" = "release" ]; then
            [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (Test)
        run: az acr login --name acrintochattest

      - name: Publish IntoChat.OS.Kernel binary
        run: |
          dotnet publish src/IntoChat.OS.Kernel/IntoChat.OS.Kernel.csproj \
            -c Release -r linux-x64 --self-contained \
            -o artifacts/kernel-bin -p:CodeGraphRefresh=false -p:DebugType=none
          tar -I 'gzip -1' -cf artifacts/kernel-bin.tar.gz -C artifacts/kernel-bin .

      - name: Pack DigitalBrain and IntoChat.OS packages
        run: |
          dotnet pack Intochat.OS.slnx -c Release -o artifacts/packages -p:CodeGraphRefresh=false -p:DebugType=none -p:IncludeSymbols=false

      - name: Build and push OS container image
        id: build-os
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/IntoChat.OS.Kernel/Dockerfile
          push: true
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
          tags: |
            acrintochattest.azurecr.io/os:${{ steps.version.outputs.version }}
            acrintochattest.azurecr.io/os:latest
          cache-from: type=gha,scope=os
          cache-to: type=gha,mode=max,scope=os

      - name: Build and push Sandbox container image
        id: build-sandbox
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/IntoChat.OS.Sandbox/Dockerfile
          push: true
          tags: |
            acrintochattest.azurecr.io/sandbox:${{ steps.version.outputs.version }}
            acrintochattest.azurecr.io/sandbox:latest
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

      - name: Write release manifest
        id: manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="${{ github.sha }}"
          OS_DIGEST="acrintochattest.azurecr.io/os@${{ steps.build-os.outputs.digest }}"
          SANDBOX_DIGEST="acrintochattest.azurecr.io/sandbox@${{ steps.build-sandbox.outputs.digest }}"
          cat <<EOF > release-manifest.json
          {
            "version": "${VERSION}",
            "commit": "${COMMIT}",
            "osImage": "${OS_DIGEST}",
            "sandboxImage": "${SANDBOX_DIGEST}"
          }
          EOF
          cat release-manifest.json

      - name: Upload release manifest and Kernel binary
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            release-manifest.json
            artifacts/kernel-bin.tar.gz
            artifacts/packages/*.nupkg
          compression-level: 1
          retention-days: 30

      - name: Attach release manifest and DigitalBrain packages to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-manifest.json artifacts/packages/*.nupkg --clobber

      - name: Push DigitalBrain packages to GitHub Packages
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in artifacts/packages/*.nupkg; do
            dotnet nuget push "$pkg" --source https://nuget.pkg.github.com/intochat/index.json --api-key "${GITHUB_TOKEN}" --skip-duplicate || echo "::warning::Could not push $pkg to GitHub Packages"
          done

      - name: NuGet login (Trusted Publishing)
        id: login
        if: github.event_name == 'release' && env.NUGET_USER != ''
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Strict: a version that already exists fails the release.
      - name: Push DigitalBrain packages to nuget.org
        if: github.event_name == 'release' && env.NUGET_USER != ''
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${NUGET_KEY}"

  # The Windows desktop bundle, setup installer, and MSIX package. It runs beside the Linux image and the deploys and none of them wait for it:
  # a packaging failure leaves the release without its Windows assets and leaves the deploys alone.
  package-windows:
    name: package-windows
    if: inputs.rollback_tag == '' || inputs.rollback_tag == null
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify CI check-run status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '[.check_runs[]|select(.name=="ci" or .name=="ci / ci")|.conclusion]|index("success")')"
          [ "${ok}" != "null" ] && [ -n "${ok}" ] || { echo "::error::ci has not succeeded for commit ${{ github.sha }}"; exit 1; }

      - name: Guard tag matches VERSION
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.event_name }}" = "release" ]; then
            [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Install Microsoft WinApp CLI
        shell: pwsh
        run: |
          winget install --id Microsoft.WinAppCLI --exact --source winget --accept-package-agreements --accept-source-agreements
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'),
            (Join-Path $env:ProgramFiles 'WinGet\Links')
          )
          $winappDir = $candidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'winapp.exe') } | Select-Object -First 1
          if (-not $winappDir) {
            $found = Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages') -Filter 'winapp.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $winappDir = $found.DirectoryName }
          }
          if ($winappDir) {
            Add-Content -Path $env:GITHUB_PATH -Value $winappDir
            $env:PATH = "$winappDir;$env:PATH"
          }
          winapp --version

      - name: Log in to Azure for Artifact Signing
        if: vars.AZURE_ARTIFACT_SIGNING_ENDPOINT != '' && vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' && vars.AZURE_ARTIFACT_SIGNING_PROFILE != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # win-x64 only: flutter build windows builds for the runner's own architecture, so an x64 runner cannot
      # produce the win-arm64 shell.
      - name: Package the Windows bundle, setup installer, and MSIX
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT }}
        run: dotnet run eng/package.cs --platform win-x64 --version ${{ steps.version.outputs.version }} --output artifacts/release

      - name: Check the bundle layout
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $version = '${{ steps.version.outputs.version }}'
          $zip = Get-Item artifacts/release/intochat-*-win-x64.zip
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try { $names = $archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') } } finally { $archive.Dispose() }
          $missing = @('IntoChat.OS.Desktop.exe', 'intochat.cmd', 'os/IntoChat.OS.Kernel.exe', 'unithost/IntoChat.OS.Sandbox.exe', 'shell/intochat_os_flutter.exe') | Where-Object { $names -notcontains $_ }
          if ($missing) { Write-Host "::error::$($zip.Name) lacks: $($missing -join ', ')"; exit 1 }
          foreach ($expected in 'intochat-win-x64.zip', 'IntoChat-Setup-win-x64.exe', "IntoChat-$version-win-x64.msix", 'IntoChat-win-x64.msix', 'IntoChat.OS.appinstaller') {
            if (-not (Test-Path -LiteralPath "artifacts/release/$expected")) { Write-Host "::error::Missing expected Windows release asset $expected"; exit 1 }
          }
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not (Select-String -LiteralPath artifacts/release/SHA256SUMS -SimpleMatch "$hash  $($zip.Name)" -Quiet)) { Write-Host "::error::SHA256SUMS does not list $($zip.Name) with its digest"; exit 1 }
          foreach ($file in 'latest.json', 'winget/IntoChat.OS.yaml') {
            if (-not (Select-String -LiteralPath "artifacts/release/$file" -SimpleMatch $hash -Quiet)) { Write-Host "::error::$file does not carry the digest of $($zip.Name)"; exit 1 }
          }
          foreach ($msixAsset in "IntoChat-$version-win-x64.msix", 'IntoChat-win-x64.msix', 'IntoChat.OS.appinstaller') {
            $assetHash = (Get-FileHash -LiteralPath "artifacts/release/$msixAsset" -Algorithm SHA256).Hash.ToLowerInvariant()
            foreach ($sumFile in 'artifacts/release/SHA256SUMS', 'artifacts/release/SHA256SUMS.win-x64') {
              if (-not (Select-String -LiteralPath $sumFile -SimpleMatch "$assetHash  $msixAsset" -Quiet)) { Write-Host "::error::$sumFile does not list $msixAsset with its digest"; exit 1 }
            }
          }

      - name: Upload the Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: |
            artifacts/release/intochat-*-win-x64.zip
            artifacts/release/intochat-win-x64.zip
            artifacts/release/IntoChat-Setup-*-win-x64.exe
            artifacts/release/IntoChat-Setup-win-x64.exe
            artifacts/release/IntoChat-*-win-x64.msix
            artifacts/release/IntoChat-win-x64.msix
            artifacts/release/IntoChat.OS.appinstaller
            artifacts/release/SHA256SUMS
            artifacts/release/SHA256SUMS.win-x64
            artifacts/release/latest.json
            artifacts/release/winget/IntoChat.OS.yaml
          compression-level: 0
          retention-days: 30

      - name: Attach the Windows bundle to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        working-directory: artifacts/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" intochat-*-win-x64.zip intochat-win-x64.zip IntoChat-Setup-*-win-x64.exe IntoChat-Setup-win-x64.exe IntoChat-*-win-x64.msix IntoChat-win-x64.msix IntoChat.OS.appinstaller SHA256SUMS latest.json winget/IntoChat.OS.yaml ../../eng/install/install.ps1 --clobber

  # The Linux desktop bundle and Debian package (linux-x64 — native Ubuntu/Linux and WSLg).
  package-linux:
    name: package-linux
    if: inputs.rollback_tag == '' || inputs.rollback_tag == null
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify CI check-run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '[.check_runs[]|select(.name=="ci" or .name=="ci / ci")|.conclusion]|index("success")')"
          [ "${ok}" != "null" ] && [ -n "${ok}" ] || { echo "::error::ci has not succeeded for commit ${{ github.sha }}"; exit 1; }

      - name: Guard tag matches VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.event_name }}" = "release" ]; then
            [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Linux GTK3 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: ui
        run: |
          flutter config --enable-linux-desktop
          flutter pub get --enforce-lockfile

      - name: Package the Linux bundle and deb installer
        run: dotnet run eng/package.cs --platform linux-x64 --version "${{ steps.version.outputs.version }}" --output artifacts/release

      - name: Check the Linux bundle layout
        run: |
          tar -tzf "artifacts/release/intochat-${{ steps.version.outputs.version }}-linux-x64.tar.gz" > /tmp/linux-entries.txt
          for req in IntoChat.OS.Desktop intochat os/IntoChat.OS.Kernel unithost/IntoChat.OS.Sandbox shell/intochat_os_flutter; do
            grep -Eq "^(\./)?${req}$" /tmp/linux-entries.txt || { echo "::error::Linux tarball lacks ${req}"; exit 1; }
          done
          test -f artifacts/release/intochat-linux-x64.tar.gz
          test -f artifacts/release/intochat-linux-amd64.deb

      - name: Upload the Linux bundle
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: |
            artifacts/release/intochat-*-linux-x64.tar.gz
            artifacts/release/intochat-linux-x64.tar.gz
            artifacts/release/intochat-*-linux-amd64.deb
            artifacts/release/intochat-linux-amd64.deb
            artifacts/release/SHA256SUMS.linux-x64
          compression-level: 0
          retention-days: 30

      - name: Attach the Linux bundle to GitHub Release
        if: github.event_name == 'release'
        working-directory: artifacts/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" intochat-*-linux-x64.tar.gz intochat-linux-x64.tar.gz intochat-*-linux-amd64.deb intochat-linux-amd64.deb ../../eng/install/install.sh --clobber

  # The macOS desktop bundle and DMG installer (osx-arm64 — Apple Silicon).
  package-macos:
    name: package-macos
    if: inputs.rollback_tag == '' || inputs.rollback_tag == null
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify CI check-run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '[.check_runs[]|select(.name=="ci" or .name=="ci / ci")|.conclusion]|index("success")')"
          [ "${ok}" != "null" ] && [ -n "${ok}" ] || { echo "::error::ci has not succeeded for commit ${{ github.sha }}"; exit 1; }

      - name: Guard tag matches VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.event_name }}" = "release" ]; then
            [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: ui
        run: |
          flutter config --enable-macos-desktop
          flutter pub get --enforce-lockfile

      - name: Package the macOS bundle and DMG installer
        run: dotnet run eng/package.cs --platform osx-arm64 --version "${{ steps.version.outputs.version }}" --output artifacts/release

      - name: Check the macOS bundle layout
        run: |
          tar -tzf "artifacts/release/intochat-${{ steps.version.outputs.version }}-osx-arm64.tar.gz" > /tmp/macos-entries.txt
          for req in IntoChat.OS.Desktop intochat os/IntoChat.OS.Kernel unithost/IntoChat.OS.Sandbox shell/intochat_os_flutter.app/Contents/MacOS/intochat_os_flutter; do
            grep -Eq "^(\./)?${req}$" /tmp/macos-entries.txt || { echo "::error::macOS tarball lacks ${req}"; exit 1; }
          done
          test -f artifacts/release/intochat-osx-arm64.tar.gz
          test -f artifacts/release/IntoChat-macos-arm64.dmg

      - name: Upload the macOS bundle
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundle
          path: |
            artifacts/release/intochat-*-osx-arm64.tar.gz
            artifacts/release/intochat-osx-arm64.tar.gz
            artifacts/release/IntoChat-*-macos-arm64.dmg
            artifacts/release/IntoChat-macos-arm64.dmg
            artifacts/release/homebrew/intochat.rb
            artifacts/release/SHA256SUMS.osx-arm64
          compression-level: 0
          retention-days: 30

      - name: Attach the macOS bundle to GitHub Release
        if: github.event_name == 'release'
        working-directory: artifacts/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" intochat-*-osx-arm64.tar.gz intochat-osx-arm64.tar.gz IntoChat-*-macos-arm64.dmg IntoChat-macos-arm64.dmg homebrew/intochat.rb ../../eng/install/install.sh --clobber

  # The Android client APK (universal release APK).
  package-android:
    name: package-android
    if: inputs.rollback_tag == '' || inputs.rollback_tag == null
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify CI check-run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '[.check_runs[]|select(.name=="ci" or .name=="ci / ci")|.conclusion]|index("success")')"
          [ "${ok}" != "null" ] && [ -n "${ok}" ] || { echo "::error::ci has not succeeded for commit ${{ github.sha }}"; exit 1; }

      - name: Guard tag matches VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.event_name }}" = "release" ]; then
            [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Package Android APK
        run: dotnet run eng/package.cs --platform android --version "${{ steps.version.outputs.version }}" --output artifacts/release

      - name: Upload the Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-bundle
          path: |
            artifacts/release/intochat-*-android.apk
            artifacts/release/intochat-android.apk
            artifacts/release/SHA256SUMS.android
          compression-level: 0
          retention-days: 30

      - name: Attach the Android APK to GitHub Release
        if: github.event_name == 'release'
        working-directory: artifacts/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" intochat-*-android.apk intochat-android.apk --clobber

  # The iOS client bundle (unsigned release IPA for sideloading / re-signing).
  package-ios:
    name: package-ios
    if: inputs.rollback_tag == '' || inputs.rollback_tag == null
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify CI check-run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '[.check_runs[]|select(.name=="ci" or .name=="ci / ci")|.conclusion]|index("success")')"
          [ "${ok}" != "null" ] && [ -n "${ok}" ] || { echo "::error::ci has not succeeded for commit ${{ github.sha }}"; exit 1; }

      - name: Guard tag matches VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.event_name }}" = "release" ]; then
            [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Package unsigned iOS IPA
        run: dotnet run eng/package.cs --platform ios --version "${{ steps.version.outputs.version }}" --output artifacts/release

      - name: Upload the iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-bundle
          path: |
            artifacts/release/intochat-*-ios-unsigned.ipa
            artifacts/release/intochat-ios-unsigned.ipa
            artifacts/release/SHA256SUMS.ios
          compression-level: 0
          retention-days: 30

      - name: Attach the iOS IPA to GitHub Release
        if: github.event_name == 'release'
        working-directory: artifacts/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" intochat-*-ios-unsigned.ipa intochat-ios-unsigned.ipa --clobber

  # Combine SHA256SUMS and ensure both versioned artifacts and stable versionless aliases
  # (/releases/latest/download/<filename>) from all 5 platforms are attached to the GitHub Release.
  publish-checksums:
    name: publish-checksums
    needs: [package-windows, package-linux, package-macos, package-android, package-ios]
    if: always() && github.event_name == 'release' && (inputs.rollback_tag == '' || inputs.rollback_tag == null)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: downloaded-bundles
          pattern: '*-bundle'
          merge-multiple: true

      - name: Merge SHA256SUMS and upload versioned and stable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          cat downloaded-bundles/SHA256SUMS* 2>/dev/null | sort -u > SHA256SUMS
          assets=(
            downloaded-bundles/*.zip
            downloaded-bundles/*.exe
            downloaded-bundles/*.msix
            downloaded-bundles/*.appinstaller
            downloaded-bundles/*.tar.gz
            downloaded-bundles/*.deb
            downloaded-bundles/*.dmg
            downloaded-bundles/*.apk
            downloaded-bundles/*.ipa
          )
          if [ -s SHA256SUMS ]; then
            assets+=(SHA256SUMS)
          fi
          if [ "${#assets[@]}" -gt 0 ]; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --repo "${{ github.repository }}" --clobber
          fi
