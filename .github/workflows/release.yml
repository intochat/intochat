name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: 'Tag of the prior release to roll back to (e.g. v0.14.1)'
        required: false
        type: string

permissions:
  contents: write
  packages: read
  id-token: write
  checks: read
  actions: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  package:
    name: package
    if: inputs.rollback_tag == '' || inputs.rollback_tag == null
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify CI check-run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '[.check_runs[]|select(.name=="ci" or .name=="ci / ci")|.conclusion]|index("success")')"
          [ "${ok}" != "null" ] && [ -n "${ok}" ] || { echo "::error::ci has not succeeded for commit ${{ github.sha }}"; exit 1; }

      - name: Guard tag matches VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.event_name }}" = "release" ]; then
            [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.DIGITALBRAIN_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile nuget.config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (Test)
        run: az acr login --name acrintochattest

      - name: Publish IntoChat.OS.Kernel binary
        run: |
          dotnet publish src/IntoChat.OS.Kernel/IntoChat.OS.Kernel/IntoChat.OS.Kernel.csproj \
            -c Release -r linux-x64 --self-contained \
            -o artifacts/kernel-bin -p:CodeGraphRefresh=false

      - name: Build and push OS container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/IntoChat.OS.Kernel/IntoChat.OS.Kernel/Dockerfile
          push: true
          tags: |
            acrintochattest.azurecr.io/os:${{ steps.version.outputs.version }}
            acrintochattest.azurecr.io/os:latest
          cache-from: type=gha,scope=os
          cache-to: type=gha,mode=max,scope=os

      - name: Build and push OS-UI container image
        uses: docker/build-push-action@v6
        with:
          context: ui
          file: ui/shell/Dockerfile
          push: true
          tags: |
            acrintochattest.azurecr.io/os-ui:${{ steps.version.outputs.version }}
            acrintochattest.azurecr.io/os-ui:latest
          cache-from: type=gha,scope=os-ui
          cache-to: type=gha,mode=max,scope=os-ui

      - name: Build and push OS-Sandbox container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/IntoChat.OS.Modules/Microsoft/CSharp/src/IntoChat.OS.Modules.Microsoft.CSharp.Sandbox/Dockerfile
          push: true
          tags: |
            acrintochattest.azurecr.io/os-sandbox:${{ steps.version.outputs.version }}
            acrintochattest.azurecr.io/os-sandbox:latest
          cache-from: type=gha,scope=os-sandbox
          cache-to: type=gha,mode=max,scope=os-sandbox

      - name: Write release manifest
        id: manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="${{ github.sha }}"
          OS_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' acrintochattest.azurecr.io/os:${VERSION})
          UI_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' acrintochattest.azurecr.io/os-ui:${VERSION})
          SANDBOX_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' acrintochattest.azurecr.io/os-sandbox:${VERSION})
          cat <<EOF > release-manifest.json
          {
            "version": "${VERSION}",
            "commit": "${COMMIT}",
            "osImage": "${OS_DIGEST}",
            "uiImage": "${UI_DIGEST}",
            "sandboxImage": "${SANDBOX_DIGEST}"
          }
          EOF
          cat release-manifest.json

      - name: Upload release manifest and Kernel binary
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            release-manifest.json
            artifacts/kernel-bin/IntoChat.OS.Kernel
          retention-days: 30

      - name: Attach release manifest to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-manifest.json --clobber

  deploy-test:
    name: deploy-test
    needs: [package]
    if: inputs.rollback_tag == '' || inputs.rollback_tag == null
    runs-on: ubuntu-24.04
    environment: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts-in

      - name: Prepare installer binary and manifest
        run: |
          cp ./artifacts-in/release-manifest.json ./release-manifest.json
          cp ./artifacts-in/artifacts/kernel-bin/IntoChat.OS.Kernel ./IntoChat.OS.Kernel
          chmod +x ./IntoChat.OS.Kernel

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy test environment
        env:
          OS_DEPLOY_SECRETS_JSON: ${{ secrets.OS_DEPLOY_SECRETS_JSON }}
        run: |
          ./IntoChat.OS.Kernel install --env test --config deploy/test.json --manifest release-manifest.json

  deploy-prod:
    name: deploy-prod
    needs: [package, deploy-test]
    if: always() && (needs.deploy-test.result == 'success' || (inputs.rollback_tag != '' && inputs.rollback_tag != null))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download rollback manifest from prior release
        if: inputs.rollback_tag != '' && inputs.rollback_tag != null
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          gh release download "$ROLLBACK_TAG" --pattern "release-manifest.json" --output release-manifest.json
          dotnet publish src/IntoChat.OS.Kernel/IntoChat.OS.Kernel/IntoChat.OS.Kernel.csproj \
            -c Release -r linux-x64 --self-contained \
            -o ./kernel-build -p:CodeGraphRefresh=false
          cp ./kernel-build/IntoChat.OS.Kernel ./IntoChat.OS.Kernel
          chmod +x ./IntoChat.OS.Kernel

      - name: Use artifacts from package job
        if: inputs.rollback_tag == '' || inputs.rollback_tag == null
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts-in

      - name: Prepare installer binary and manifest
        if: inputs.rollback_tag == '' || inputs.rollback_tag == null
        run: |
          cp ./artifacts-in/release-manifest.json ./release-manifest.json
          cp ./artifacts-in/artifacts/kernel-bin/IntoChat.OS.Kernel ./IntoChat.OS.Kernel
          chmod +x ./IntoChat.OS.Kernel

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy production environment
        env:
          OS_DEPLOY_SECRETS_JSON: ${{ secrets.OS_DEPLOY_SECRETS_JSON }}
        run: |
          ./IntoChat.OS.Kernel install --env prod --config deploy/prod.json --manifest release-manifest.json --promote-from /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-intochat-test/providers/Microsoft.ContainerRegistry/registries/acrintochattest
